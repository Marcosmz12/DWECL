<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Ejercicio 7</title>
</head>

<body>
    <script>
        document.write("<table border='1'>");
        document.write("<tr><th>Número</th><th>Seno</th></tr>");

        // Por ejemplo, del 0 al 10
        for (let i = 0; i <= 10; i++) {
            document.write("<tr>");
            document.write("<td>" + i + "</td>");
            document.write("<td>" + Math.sin(i) + "</td>");
            document.write("</tr>");
        }

        document.write("</table>");
    </script>
</body>

</html>
