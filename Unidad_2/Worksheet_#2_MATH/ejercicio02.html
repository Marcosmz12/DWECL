<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Ejercicio 2</title>
</head>

<body>
    <script>
        let grados = Number(prompt("Introduce un ángulo en grados:"));


        let radianes = grados * (Math.PI / 180);

        document.write("<p>Ángulo: " + grados + "°</p>");
        document.write("<p>Seno: " + Math.sin(radianes) + "</p>");
        document.write("<p>Coseno: " + Math.cos(radianes) + "</p>");
        document.write("<p>Tangente: " + Math.tan(radianes) + "</p>");
    </script>
</body>

</html>
