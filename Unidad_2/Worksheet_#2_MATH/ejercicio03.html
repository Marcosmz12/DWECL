<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Ejercicio 3</title>
</head>

<body>
    <script>
        let cateto1 = Number(prompt("Introduce el tamaño del primer cateto:"));
        let cateto2 = Number(prompt("Introduce el tamaño del segundo cateto:"));

        let hipotenusa = Math.sqrt(Math.pow(cateto1, 2) + Math.pow(cateto2, 2));

        document.write("<p>La hipotenusa es: " + hipotenusa + "</p>");
    </script>
</body>

</html>
