<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 05</title>
    <script src="index.js" defer></script>
</head>

<body>
    <h1>Worksheet_#1_DATE</h1>
    <h2>5. Usando el objeto Date, sus m todos getHours, getMinutes y GetSeconds y
        el metodo setTimeout() crea un reloj que se actualice cada segundo.</h2>
    <hr>
    <h1 id="reloj"></h1>
    <script>
        function reloj() {
            let fecha = new Date();

            let h = fecha.getHours();
            let m = fecha.getMinutes();
            let s = fecha.getSeconds();

            document.getElementById("reloj").innerHTML = h + ":" + m + ":" + s;

            setTimeout(reloj, 1000);
        }

        reloj();
    </script>
</body>

</html>
