<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 5</title>
</head>
<body>
    <script>
        function eliminarRepetidos(cadena) {
            let resultado = "";

            for (let i = 0; i < cadena.length; i++) {
                let caracter = cadena.charAt(i);
                // Si el carácter aún no está en resultado, lo añadimos
                if (resultado.indexOf(caracter) === -1) {
                    resultado += caracter;
                }
            }
            return resultado;
        }

        let texto = prompt("Introduce una cadena de texto:");
        document.write("<p>Sin repetidos: " + eliminarRepetidos(texto) + "</p>");
    </script>
</body>
</html>
