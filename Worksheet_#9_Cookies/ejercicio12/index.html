<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Ejercicio 12 — Cookie de 30 segundos</title>
</head>

<body>

    <script>
        let fecha = new Date();


        fecha.setTime(fecha.getTime() + (30 * 1000));


        document.cookie = "nombre=Marcos; expires=" + fecha.toUTCString() + "; path=/";

        console.log("Cookie creada. Caducará en 30 segundos.");
        document.write(fecha);
    </script>

</body>

</html>
