<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Ejercicio 11 — Cookie con caducidad</title>
</head>

<body>

    <script>
        let fecha = new Date();

        fecha.setTime(fecha.getTime() + (24 * 60 * 60 * 1000));

        document.cookie = "nombre=Marcos; expires=" + fecha.toUTCString() + "; path=/";

        console.log("Cookie creada con éxito");
        document.write(document.cookie);
    </script>

</body>

</html>
