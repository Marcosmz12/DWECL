<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        const calcular = (a, b = 10, ...theRest) => {
            console.log(`Números adicionales: ${theRest.length}`);

            const sumaAdicionales = theRest.reduce((acumulador, numero) => acumulador + numero, 0);
            return a + b + sumaAdicionales;
        };

        console.log(calcular(5, 3, 7, 9));
        console.log(calcular(5));          
    </script>
</body>

</html>
