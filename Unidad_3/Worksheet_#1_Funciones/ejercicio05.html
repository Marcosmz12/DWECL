<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        function sumar(primerNumero, ...theRest) {
            let total = primerNumero;
            for (let numero of theRest) {
                total += numero;
            }
            return total;
        }
        console.log(sumar(10));
        console.log(sumar(10, 20));
        console.log(sumar(10, 20, 30, 40));
    </script>
</body>

</html>
